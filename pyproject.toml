[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opencoach"
version = "0.1.0"
description = "Single-screen golf camera commentary demo."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.10.0",
    "click>=8.1.8",
    "fastapi>=0.115.0",
    "huggingface-hub>=0.34.0",
    "jinja2>=3.1.4",
    "numpy>=2.2.0",
    "opencv-python>=4.11.0",
    "pillow>=11.3.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.8.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "rfdetr>=1.6.4",
    "structlog>=25.4.0",
    "supervision>=0.27.0",
    "torch>=2.8.0,<2.9",
    "torchvision>=0.23.0,<0.24",
    "transformers>=4.57.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.3.0",
    "pytest>=8.3.4",
    "ruff>=0.15.2",
]
model-runtime = [
    "appdirs>=1.4.4",
    "cython>=3.2.0",
    "dill>=0.4.0",
    "einops>=0.8.0",
    "ffmpeg>=1.4",
    "fvcore>=0.1.5.post20221221",
    "hydra-colorlog>=1.2.0",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "joblib>=1.5.0",
    "jsonlines>=4.0.0",
    "loguru>=0.7.0",
    "networkx==3.2.1",
    "pandas>=2.2.3",
    "pycocotools>=2.0.10",
    "pyrootutils>=1.0.4",
    "pyrender>=0.1.45",
    "pytorch-lightning>=2.5.0",
    "roma>=1.5.0",
    "scikit-image>=0.25.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.19.0",
    "timm>=1.0.15",
    "webdataset>=1.0.2",
    "xtcocotools>=1.14.3",
    "yacs>=0.1.8",
]
tts-runtime = [
    "piper-tts>=1.4.2",
]

[project.scripts]
opencoach = "opencoach.cli:main"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
norecursedirs = [".venv", "__pycache__", "external", "models"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["opencoach*"]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
